# HAND-KEPT (not generated by scripts/derive_beta.py): the beta image of the app is ahead of the stable one (optional rp_id / rp_origins, a password on its own, arm64).
# When that reaches the stable app, copy these changes into ../printpricing and remove `hand_kept` from sources.json. `version` is raised by scripts/sync_versions.py.
name: 3D Print Pricing (beta)
version: "0.26.21-beta.202610281201"
slug: printpricing_beta
description: Development version (beta). Cost price calculator and inventory for a 3D-print business, with its own PostgreSQL database
url: https://github.com/Flux76HQ/3dprint_pricing
arch:
  - amd64
  - aarch64
# One container holds the app and its PostgreSQL. A running database is not a consistent file copy, so the app is stopped for a backup.
backup: cold
# Stopping has to give gunicorn and PostgreSQL time to finish cleanly.
timeout: 60
ports:
  6080/tcp: 6081
ports_description:
  6080/tcp: Web interface
watchdog: "http://[HOST]:[PORT:6080]/healthz"
# /data of this app is the app's DATA_PATH: the database in /data/postgres, the uploads in /data/uploads, the generated secrets in /data/secrets.json.
options:
  proxy_hops: 0
  max_upload_mb: 50
  ai_images_enabled: false
  update_check: true
schema:
  rp_id: "str?"
  rp_origins: "str?"
  setup_code: "password?"
  proxy_hops: "int(0,5)"
  max_upload_mb: "int(1,500)"
  ai_images_enabled: bool
  spoolman_url: "url?"
  update_check: bool
