name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pyyaml
      - name: The beta add-ons match their stable add-ons
        run: python scripts/derive_beta.py --check
      - name: Every add-on is complete and consistent
        run: python scripts/check_addons.py
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: Node tests
        run: node --test tests/*.test.js

  lint:
    name: Add-on linter (${{ matrix.addon }})
    runs-on: ubuntu-latest
    # The linter of the Home Assistant community has opinions this repository does not share (for example about build.yaml); its findings are advice.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        addon: [discvault, discvault-beta, doorbell-map, doorbell-map-beta, mealieshopper, mealieshopper-beta, printpricing, printpricing-beta]
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  build:
    name: Build (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The add-ons with a Dockerfile; the others pull a ready-made image and have nothing to build.
        addon: [discvault, discvault-beta, doorbell-map, doorbell-map-beta, printpricing, printpricing-beta]
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"$/\1/p' ${{ matrix.addon }}/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the way the Supervisor does
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          platforms: linux/amd64
          push: false
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
