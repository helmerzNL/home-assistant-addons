configuration:
  origin:
    name: Adres waarop de kaart wordt geopend (ORIGIN)
    description: >-
      Optioneel. De volledige URL die je in de browser gebruikt, bijvoorbeeld https://kaart.example.com; die moet dan precies het adres in de
      adresbalk zijn. Leeg betekent het adres waarop de kaart wordt geopend, ook http://homeassistant.local:9888. Passkeys werken alleen via https
      (of op localhost); op een ander adres logt de beheerder in met een wachtwoord.
  rp_id:
    name: Domein voor passkeys (RP_ID)
    description: >-
      Alleen de domeinnaam, zonder https:// en zonder poort. Optioneel: leeg betekent de hostnaam van het adres hierboven (of van het adres in de
      browser). Passkeys zijn eraan gebonden.
  site_title:
    name: Sitenaam
    description: De naam van de site totdat je die in het beheer aanpast. Optioneel.
  setup_token:
    name: Instelcode
    description: >-
      Eenmalig nodig om de allereerste passkey of het eerste wachtwoord van de beheerder in te stellen. Leeg maakt er een en toont die op het
      tabblad Logboek.
  session_hours:
    name: Beheersessie (uren)
    description: Hoe lang de beheerder ingelogd blijft. Optioneel; standaard 12.
  max_backups:
    name: Te bewaren back-ups
    description: >-
      Hoeveel van de eigen back-ups van de app bewaard blijven; oudere worden opgeruimd, ook bij het starten. Optioneel; standaard 50
      (vóór versie 2.0 was dat 200).
network:
  9888/tcp: Webinterface
