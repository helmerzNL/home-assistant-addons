configuration:
  origin:
    name: Address the map is opened on (ORIGIN)
    description: >-
      Optional. The full address browsers use, for example https://map.example.com; it then has to be exactly the address in the browser bar.
      Empty means the address the map is opened on, also http://homeassistant.local:9888. Passkeys only work over https (or on localhost);
      on any other address the admin signs in with a password.
  rp_id:
    name: Domain for passkeys (RP_ID)
    description: >-
      Only the domain name, without https:// or a port. Optional: empty means the host name of the address above (or of the address in the
      browser). Passkeys are bound to it.
  site_title:
    name: Site name
    description: The name of the site until you change it in the admin. Optional.
  setup_token:
    name: Setup code
    description: >-
      Typed once to set up the very first passkey or password of the admin. Empty makes one and prints it in the Log tab.
  session_hours:
    name: Admin session (hours)
    description: How long the admin stays signed in. Optional; default 12.
network:
  9888/tcp: Web interface
