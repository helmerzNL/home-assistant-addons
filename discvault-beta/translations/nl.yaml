configuration:
  rp_id:
    name: Domein voor passkeys (RP_ID)
    description: >-
      De domeinnaam waarop DiscVault wordt geopend, zonder https:// en zonder poort, bijvoorbeeld vault.example.com. Passkeys zijn eraan
      gebonden: later wijzigen maakt bestaande passkeys onbruikbaar. Verplicht, tenzij inloggen met wachtwoord aanstaat.
  rp_origins:
    name: Adres(sen) waarop DiscVault wordt geopend (RP_ORIGINS)
    description: >-
      Het volledige adres dat browsers gebruiken, kommagescheiden, bijvoorbeeld https://vault.example.com. Leeg betekent https:// plus het domein hierboven.
  rp_name:
    name: Naam bij passkeys
    description: De naam die je browser toont bij het aanmaken of gebruiken van een passkey. Standaard DiscVault.
  password_login:
    name: Inloggen met wachtwoord (in plaats van passkeys)
    description: >-
      Maak het eerste account aan met een gebruikersnaam en wachtwoord (minstens 15 tekens) en een authenticator-app (TOTP), zonder domein of https. Staat dit aan, dan is rp_id optioneel; met een domein kun je ook passkeys gebruiken. Standaard uit.
  trusted_proxies:
    name: Vertrouwde proxy's
    description: >-
      Adres(sen) van de reverse proxy vóór DiscVault (kommagescheiden), zodat clientadressen in het auditlogboek kloppen. Leeg betekent dat
      geen doorstuurheader wordt geloofd. Optioneel.
  omdb_api_key:
    name: OMDb API-sleutel
    description: Optioneel. Gratis sleutel van omdbapi.com voor het opzoeken van filmgegevens.
  tmdb_api_key:
    name: TMDb API-sleutel
    description: Optioneel. Gratis sleutel van themoviedb.org, gebruikt als OMDb niets vindt.
  block_crawlers:
    name: Zoekmachines en AI-crawlers blokkeren
    description: Houdt deze installatie uit zoekresultaten en AI-trainingsdata. Standaard aan.
  oidc_issuer:
    name: OpenID Connect-issuer
    description: >-
      Optioneel. Het https-adres van je identiteitsprovider (Pocket ID, Authentik, Keycloak...), bijvoorbeeld https://id.example.com. Vul dit samen
      met de client-ID en het geheim in, of laat alle drie leeg. Vraagt om het adres waarop DiscVault wordt geopend (rp_id of rp_origins).
  oidc_client_id:
    name: OpenID Connect client-ID
    description: Optioneel. De client-ID van de vertrouwelijke client die je in de identiteitsprovider hebt gemaakt. Het redirect-adres staat op het tabblad Documentatie.
  oidc_client_secret:
    name: OpenID Connect clientgeheim
    description: Optioneel. Het clientgeheim van die client.
  oidc_provider_name:
    name: Naam op de inlogknop
    description: Optioneel. De naam van de identiteitsprovider zoals die op de inlogknop staat. Standaard OIDC.
  oidc_insecure_backchannel_origins:
    name: Privéadressen van de provider (geavanceerd)
    description: >-
      Optioneel. Alleen als de provider privé-http-adressen publiceert voor token- en sleutelverzoeken: de exacte origins, kommagescheiden,
      bijvoorbeeld http://pocket-id.local:1411. Anders leeg laten.
network:
  5000/tcp: Webinterface (het MCP-eindpunt zit op dezelfde poort, onder /mcp)
